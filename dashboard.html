<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard - Bot Rasuk</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>//eruda.init();</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; background:#0b0b1a; position:relative; overflow-x:hidden; }
        #bgVideo { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; filter:brightness(0.35) saturate(1.1); }
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:1; pointer-events:none; }
        
        .card { position:relative; z-index:2; width:100%; max-width:540px; background:rgba(255,255,255,0.08); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-radius:32px; padding:32px 30px 28px; border:1px solid rgba(255,255,255,0.12); box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); transition:transform 0.3s ease, box-shadow 0.3s ease; color:#fff; }
        .card:hover { transform:translateY(-4px); box-shadow:0 30px 60px -12px rgba(0,0,0,0.6); }
        
        .header-main { margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .header-left { display:flex; flex-direction:column; }
        .header-left h1 { font-size:28px; font-weight:700; letter-spacing:1px; }
        .header-left h1 i { color:#ffd700; margin-right:8px; }
        .header-left .sub { font-size:14px; opacity:0.65; margin-top:4px; }
        .header-left .sub i { margin-right:6px; color:#ffd700; }
        .exit-btn {
            color: #ff6b6b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,107,107,0.3);
            background: rgba(255,107,107,0.1);
            transition: 0.2s;
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .exit-btn:hover {
            background: rgba(255,107,107,0.2);
            border-color: #ff6b6b;
        }

        .corner-info {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: left;
            min-width: 140px;
        }
        .corner-info .pwd-box {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-start;
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
        }
        .corner-info .pwd-box i { font-size: 15px; }
        .corner-info .pwd-box .fa-eye, 
        .corner-info .pwd-box .fa-eye-slash,
        .corner-info .pwd-box .fa-copy {
            opacity: 0.6;
            transition: 0.2s;
            cursor: pointer;
        }
        .corner-info .pwd-box .fa-eye:hover, 
        .corner-info .pwd-box .fa-eye-slash:hover,
        .corner-info .pwd-box .fa-copy:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .corner-info .timer-box {
            font-size: 13px;
            margin-top: 6px;
            color: #8cf;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        @keyframes glitch {
            0% { text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff; transform: translate(0); }
            20% { text-shadow: -2px 0 #00ffff, 2px 0 #ff00ff; transform: translate(-2px, 1px); }
            40% { text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff; transform: translate(2px, -1px); }
            60% { text-shadow: -2px 0 #00ffff, 2px 0 #ff00ff; transform: translate(-2px, 1px); }
            80% { text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff; transform: translate(2px, -1px); }
            100% { text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff; transform: translate(0); }
        }
        .glitch-text {
            animation: glitch 0.8s infinite;
            color: #fff;
            font-weight: 700;
        }

        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:13px; font-weight:600; opacity:0.8; margin-bottom:5px; letter-spacing:0.3px; }
        .form-group label i { margin-right:8px; color:#ffd700; width:20px; }
        .form-group input, .form-group textarea, .form-group select { width:100%; padding:12px 16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:14px; color:#fff; font-family:inherit; font-size:14px; transition:all 0.3s; outline:none; backdrop-filter:blur(4px); }
        .form-group select option { background:#1a1a2e; color:#fff; }
        .form-group input::placeholder, .form-group textarea::placeholder { opacity:0.5; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color:#ffd700; box-shadow:0 0 0 3px rgba(255,215,0,0.15); }
        .form-group textarea { min-height:80px; resize:vertical; }
        .form-row { display:flex; gap:15px; }
        .form-row .form-group { flex:1; }
        .file-upload-wrapper { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
        .file-upload-wrapper input[type="file"] { flex:1; min-width:150px; padding:10px 12px; background:rgba(255,255,255,0.06); border:1px dashed rgba(255,255,255,0.3); border-radius:14px; color:#fff; font-size:13px; cursor:pointer; }
        .file-upload-wrapper input[type="file"]::-webkit-file-upload-button { background:#ffd700; border:none; border-radius:8px; padding:6px 16px; color:#1a1a2e; font-weight:600; margin-right:12px; cursor:pointer; }
        .photo-preview { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
        .photo-preview .preview-item { position:relative; width:80px; height:80px; border-radius:12px; overflow:hidden; border:2px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); }
        .photo-preview .preview-item img { width:100%; height:100%; object-fit:cover; }
        .photo-preview .preview-item .remove-photo { position:absolute; top:4px; right:4px; background:rgba(255,0,0,0.8); border:none; color:#fff; width:20px; height:20px; border-radius:50%; font-size:12px; line-height:20px; text-align:center; cursor:pointer; transition:0.2s; }
        .photo-preview .preview-item .remove-photo:hover { transform:scale(1.1); background:#ff0000; }
        .btn-spam { width:100%; padding:14px; border:none; border-radius:14px; font-family:inherit; font-size:18px; font-weight:700; cursor:pointer; transition:all 0.3s; letter-spacing:0.5px; display:inline-flex; align-items:center; justify-content:center; gap:10px; margin-top:6px; }
        .btn-spam:disabled { opacity:0.6; cursor:not-allowed; transform:none !important; }
        .btn-start { background:linear-gradient(135deg,#ffd700,#f5a623); color:#1a1a2e; box-shadow:0 8px 20px rgba(255,215,0,0.25); }
        .btn-start:hover:not(:disabled) { transform:scale(1.02); box-shadow:0 12px 30px rgba(255,215,0,0.4); }
        .btn-stop { background:linear-gradient(135deg,#ff6b6b,#ee5a24); color:#fff; box-shadow:0 8px 20px rgba(255,107,107,0.25); }
        .btn-stop:hover:not(:disabled) { transform:scale(1.02); box-shadow:0 12px 30px rgba(255,107,107,0.4); }
        .change-bot-toggle { display:flex; justify-content:center; margin-top:24px; }
        .change-bot-toggle button { background:transparent; border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 20px; border-radius:40px; font-size:14px; cursor:pointer; transition:all 0.3s; display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.05); backdrop-filter:blur(4px); }
        .change-bot-toggle button:hover { background:rgba(255,215,0,0.15); border-color:#ffd700; }
        .change-bot-toggle button i { color:#ffd700; }
        .change-bot-panel { margin-top:24px; padding-top:24px; border-top:1px solid rgba(255,255,255,0.08); display:none; transition:all 0.3s; }
        .change-bot-panel.open { display:block; }
        .change-bot-panel .form-group { margin-bottom:22px; }
        .change-bot-panel .form-row { margin-bottom: 24px; }
        .change-bot-panel .form-group:last-child { margin-bottom:0; }
        .btn-update-bot { background:linear-gradient(135deg,#00b894,#00a381); color:#fff; box-shadow:0 8px 20px rgba(0,184,148,0.25); width:100%; padding:14px; border:none; border-radius:14px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:all 0.3s; display:inline-flex; align-items:center; justify-content:center; gap:10px; margin-top:24px; }
        .btn-update-bot:hover { transform:scale(1.02); box-shadow:0 12px 30px rgba(0,184,148,0.4); }
        .btn-load-bot { background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); width:100%; padding:12px; border-radius:14px; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.3s; display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px; }
        .btn-load-bot:hover { background:rgba(255,255,255,0.2); }
        .change-bot-panel .btn-spam { margin-top:16px; margin-bottom:10px; }
        .footer { text-align:center; margin-top:22px; font-size:12px; opacity:0.25; letter-spacing:0.5px; }
        #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:rgba(0,0,0,0.8); backdrop-filter:blur(12px); padding:14px 28px; border-radius:40px; color:#fff; font-size:14px; font-weight:500; border:1px solid rgba(255,255,255,0.1); box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:999; transition:all 0.4s ease; opacity:0; pointer-events:none; white-space:nowrap; max-width:90%; }
        #toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
        #toast i { margin-right:10px; }
        .toast-success i { color:#2ecc71; }
        .toast-error i { color:#ff6b6b; }
        .toast-info i { color:#ffd700; }

        #passwordChangeModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        #passwordChangeModal .modal-box {
            background: #1a1a2e;
            padding: 24px 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,215,0,0.3);
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        #passwordChangeModal .modal-box i {
            color: #ffd700;
            font-size: 40px;
            margin-bottom: 12px;
        }
        #passwordChangeModal .modal-box h2 {
            margin-bottom: 10px;
            font-size: 20px;
        }
        #passwordChangeModal .modal-box p {
            font-size: 14px;
            opacity: 0.8;
            margin: 4px 0;
        }
        #passwordChangeModal .modal-box .countdown {
            margin-top: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #ff6b6b;
        }
        @media (max-width:600px) { body { padding:15px; } .card { padding:24px 18px 20px; } .header-left h1 { font-size:24px; } .header-left .sub { font-size:13px; } .form-row { flex-direction:column; gap:0; } .btn-spam { font-size:16px; padding:13px; } .corner-info { top:10px; left:10px; padding:10px 12px; min-width:auto; } .corner-info .pwd-box, .corner-info .timer-box { font-size:11px; } #toast { font-size:13px; padding:12px 20px; white-space:normal; max-width:92%; bottom:20px; } }
        @media (max-width:400px) { .card { padding:18px 12px 16px; } .header-left h1 { font-size:20px; } .header-left .sub { font-size:12px; } .form-group input, .form-group textarea, .form-group select { padding:10px 12px; font-size:13px; } }
    </style>
</head>
<body>
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="vid/vid.mp4" type="video/mp4">
        <source src="vid/vid.webm" type="video/webm">
    </video>
    <div class="overlay"></div>

    <div class="card" id="mainCard">
        <div class="header-main">
            <div class="header-left">
                <h1><i class="fas fa-bolt"></i> Bot Rasuk</h1>
                <div class="sub"><i class="fas fa-robot"></i> Dashboard Spammer</div>
            </div>
            <a href="#" id="exitBtn" class="exit-btn"><i class="fas fa-sign-out-alt"></i> Exit</a>
        </div>

        <form id="spamForm" onsubmit="return false;">
            <div class="form-group">
                <label><i class="fas fa-key"></i> Bot Token</label>
                <input type="text" id="botToken" placeholder="7890123456:AAH...your_bot_token" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-bullseye"></i> Chat ID (Target)</label>
                <input type="text" id="chatId" placeholder="-1001234567890 or @username" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-code"></i> Parse Mode</label>
                <select id="parseMode">
                    <option value="HTML">HTML</option>
                    <option value="Markdown">Markdown</option>
                    <option value="plain" selected>Plain Text</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-comment-dots"></i> Pesan (caption jika ada foto)</label>
                <textarea id="message" placeholder="Tulis pesan spam di sini..." required>SkTeam Terminal V1.0 - HACK THE PLANET</textarea>
            </div>
            <div class="form-group">
                <label><i class="fas fa-image"></i> Foto (max 3)</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="photoInput" accept="image/*" multiple>
                    <span class="file-count" id="fileCount">0 / 3</span>
                </div>
                <div class="photo-preview" id="photoPreview"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-clock"></i> Interval (ms)</label>
                    <input type="number" id="interval" value="1000" min="200" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> Jumlah Pesan</label>
                    <input type="number" id="count" value="10" min="1" required>
                </div>
            </div>
            <button type="button" class="btn-spam btn-start" id="spamToggleBtn">
                <i class="fas fa-paper-plane"></i> Mulai Spam
            </button>
        </form>

        <div class="change-bot-toggle">
            <button id="changeBotToggleBtn"><i class="fas fa-pen-fancy"></i> Change Bot</button>
        </div>

        <div class="change-bot-panel" id="changeBotPanel">
            <div id="botInfoDisplay" style="background: rgba(255,255,255,0.06); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); display: none;">
                <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px;">
                    <div><strong style="color:#ffd700;">Nama Bot:</strong> <span id="dispBotName" style="color: #fff;">-</span></div>
                    <div><strong style="color:#ffd700;">ID Bot:</strong> <span id="dispBotId" style="color: #fff;">-</span></div>
                    <div><strong style="color:#ffd700;">Username:</strong> <span id="dispBotUsername" style="color: #fff;">-</span></div>
                </div>
            </div>

            <button class="btn-load-bot" id="loadBotInfoBtn"><i class="fas fa-download"></i> Load Info dari Bot</button>
            
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Nama Bot</label>
                    <input type="text" id="settingBotName" placeholder="Unknown" value="Unknown">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-align-left"></i> Welcome Message</label>
                    <input type="text" id="settingBotDesc" placeholder="Unknown" value="Unknown">
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-comment"></i> Deskripsi Bot (Bio)</label>
                <textarea id="settingWelcomeText" placeholder="Unknown" rows="3">Unknown</textarea>
            </div>
            <button class="btn-update-bot" id="updateBotInfoBtn"><i class="fas fa-save"></i> Update Bot Info</button>
            <button class="btn-spam" id="resetSettingsBtn" style="background: rgba(255,255,255,0.1); color: #fff; box-shadow: none; width:100%;">
                <i class="fas fa-undo"></i> Reset ke Default
            </button>
        </div>

        <div class="footer" id="footerDisplay">
            © By SkTeamProject - All Rights Reserved
        </div>
    </div>

    <div class="corner-info" id="cornerInfo">
        <div class="pwd-box">
            <i class="fas fa-key"></i> <span id="displayPassword">****</span>
            <i class="fas fa-eye" id="togglePwdIcon" style="cursor:pointer;"></i>
            <i class="fas fa-copy" id="copyPwdIcon" style="cursor:pointer; margin-left:5px;"></i>
        </div>
        <div class="timer-box" id="timerBox">⏳ --:--:--:--</div>
    </div>

    <div id="passwordChangeModal">
        <div class="modal-box">
            <i class="fas fa-key"></i>
            <h2>Password Diganti Owner</h2>
            <p>Password lama Anda: <strong id="oldPasswordDisplay">****</strong></p>
            <p>Password baru Anda: <strong id="newPasswordDisplay">****</strong></p>
            <p>Anda akan logout otomatis dalam hitungan detik.</p>
            <div class="countdown" id="countdownDisplay">5 detik</div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="config/config.js"></script>

    <script>
        (function() {
            const SUPABASE_URL = CONFIG.SUPABASE_URL;
            const SUPABASE_ANON_KEY = CONFIG.SUPABASE_ANON_KEY;

            const savedPass = sessionStorage.getItem('bot_rasuk_pass');
            const savedUniqueId = sessionStorage.getItem('bot_rasuk_uniqueid');
            let savedExpiry = sessionStorage.getItem('bot_rasuk_expiry');
            
            if (savedExpiry === "null" || savedExpiry === "undefined" || savedExpiry === "") {
                savedExpiry = null;
            }

            if (!savedPass || !savedUniqueId || savedPass === "" || savedUniqueId === "") {
                sessionStorage.clear();
                window.location.href = 'index.html';
                return;
            }

            if (savedExpiry) {
                const expiryDate = new Date(savedExpiry);
                if (!isNaN(expiryDate.getTime()) && expiryDate < new Date()) {
                    sessionStorage.clear();
                    window.location.href = 'index.html';
                    return;
                }
            }

            document.getElementById('exitBtn').addEventListener('click', function(e) {
                e.preventDefault();
                sessionStorage.removeItem('bot_rasuk_pass');
                sessionStorage.removeItem('bot_rasuk_expiry');
                window.location.href = 'index.html';
            });

            let toastTimeout;
            function showToast(message, type = 'info', duration = 4000) {
                const toast = document.getElementById('toast');
                clearTimeout(toastTimeout);
                toast.className = `toast-${type}`;
                toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle'}"></i> ${message}`;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            const displayPassword = document.getElementById('displayPassword');
            const togglePwdIcon = document.getElementById('togglePwdIcon');
            const copyPwdIcon = document.getElementById('copyPwdIcon');
            let isPasswordVisible = false;

            togglePwdIcon.addEventListener('click', function() {
                isPasswordVisible = !isPasswordVisible;
                displayPassword.textContent = isPasswordVisible ? savedPass : '****';
                this.className = isPasswordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
            });

            copyPwdIcon.addEventListener('click', function() {
                navigator.clipboard.writeText(savedPass);
                showToast('Password berhasil disalin!', 'success', 2000);
            });

            const timerBox = document.getElementById('timerBox');
            const spamToggleBtn = document.getElementById('spamToggleBtn');
            let redirectTimeout = null;

            function updateTimer() {
                const now = new Date();
                let expiry = null;
                if (savedExpiry && savedExpiry !== "null") {
                    expiry = new Date(savedExpiry);
                    if (isNaN(expiry.getTime())) {
                        expiry = null;
                    }
                }
                
                if (!expiry) {
                    timerBox.innerHTML = '♾️ UNLIMITED';
                    timerBox.className = 'timer-box glitch-text';
                    return;
                }
                
                timerBox.className = 'timer-box';

                const diff = expiry - now;
                if (diff <= 0) {
                    timerBox.innerHTML = '⛔ EXPIRED';
                    spamToggleBtn.disabled = true;
                    spamToggleBtn.className = 'btn-spam btn-start';
                    spamToggleBtn.innerHTML = '<i class="fas fa-lock"></i> Sesi Berakhir';
                    if (!redirectTimeout) {
                        showToast('⛔ Waktu akses lo udah habis! Redirecting...', 'error', 5000);
                        redirectTimeout = setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 3000);
                    }
                    return;
                }

                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                    spamToggleBtn.disabled = false;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                timerBox.innerHTML = `⏳ ${String(days).padStart(2, '0')}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            updateTimer();
            setInterval(updateTimer, 1000);

            const POLL_INTERVAL = 200;
            let pollingInterval = null;

            async function checkSessionChanges() {
                try {
                    const resp = await fetch(`${SUPABASE_URL}/rest/v1/users?password=eq.${savedPass}&select=*`, {
                        method: 'GET',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    const data = await resp.json();

                    if (data.length === 0) {
                        const modal = document.getElementById('passwordChangeModal');
                        const oldPwdSpan = document.getElementById('oldPasswordDisplay');
                        const newPwdSpan = document.getElementById('newPasswordDisplay');
                        const countdownSpan = document.getElementById('countdownDisplay');
                        
                        oldPwdSpan.textContent = savedPass;
                        modal.style.display = 'flex';
                        
                        clearInterval(pollingInterval);
                        
                        try {
                            const newDataResp = await fetch(`${SUPABASE_URL}/rest/v1/users?unique_id=eq.${savedUniqueId}&select=*`, {
                                headers: {
                                    'apikey': SUPABASE_ANON_KEY,
                                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                                }
                            });
                            const newData = await newDataResp.json();
                            if (newData && newData.length > 0) {
                                const newUser = newData[0];
                                newPwdSpan.textContent = newUser.password || 'Belum diatur Owner';
                                sessionStorage.setItem('bot_rasuk_expiry', newUser.expires_at);
                            } else {
                                newPwdSpan.textContent = 'Menunggu pengaturan Owner...';
                            }
                        } catch (e) {
                            newPwdSpan.textContent = 'Error mengambil data baru';
                            console.error(e);
                        }
                        
                        let countdown = 5;
                        countdownSpan.textContent = countdown + ' detik';
                        const countdownInterval = setInterval(() => {
                            countdown--;
                            countdownSpan.textContent = countdown + ' detik';
                            if (countdown <= 0) {
                                clearInterval(countdownInterval);
                                sessionStorage.removeItem('bot_rasuk_pass');
                                sessionStorage.removeItem('bot_rasuk_expiry');
                                window.location.href = 'index.html';
                            }
                        }, 1000);
                        return;
                    }

                    const user = data[0];
                    const newExpiry = user.expires_at;

                    if (newExpiry !== savedExpiry) {
                        showToast('⏱️ Waktu akses telah diperbarui oleh Owner!', 'info', 4000);
                        sessionStorage.setItem('bot_rasuk_expiry', newExpiry);
                        location.reload();
                    }
                } catch (err) {
                    console.log("Polling silent error:", err.message);
                }
            }

            pollingInterval = setInterval(checkSessionChanges, POLL_INTERVAL);

            let deletePollInterval = null;
            if (savedUniqueId) {
                deletePollInterval = setInterval(async () => {
                    try {
                        const resp = await fetch(`${SUPABASE_URL}/rest/v1/users?unique_id=eq.${savedUniqueId}&select=id`, {
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                            }
                        });
                        const data = await resp.json();
                        
                        if (data.length === 0) {
                            clearInterval(deletePollInterval);
                            clearInterval(pollingInterval);
                            
                            showToast('Akun lo dihapus sama owner! Logout dalam 3 detik...', 'error', 5000);
                            
                            setTimeout(() => {
                                sessionStorage.clear();
                                window.location.href = 'index.html';
                            }, 3000);
                        }
                    } catch (err) {
                        console.log("Delete polling silent error:", err.message);
                    }
                }, 5000);
            }

            const botToken = document.getElementById('botToken');
            const chatId = document.getElementById('chatId');
            const message = document.getElementById('message');
            const interval = document.getElementById('interval');
            const count = document.getElementById('count');
            const parseMode = document.getElementById('parseMode');
            const photoInput = document.getElementById('photoInput');
            const photoPreview = document.getElementById('photoPreview');
            const fileCount = document.getElementById('fileCount');
            let uploadedFiles = [];

            photoInput.addEventListener('change', function(e) {
                const files = Array.from(e.target.files);
                const remaining = 3 - uploadedFiles.length;
                if (files.length > remaining) {
                    showToast(`Maksimal 3 foto, tersisa ${remaining} slot`, 'error');
                    this.value = '';
                    return;
                }
                const newFiles = files.slice(0, remaining);
                uploadedFiles = uploadedFiles.concat(newFiles);
                updatePreview();
                updateFileCount();
                this.value = '';
            });

            function updatePreview() {
                photoPreview.innerHTML = '';
                uploadedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        div.innerHTML = `
                            <img src="${e.target.result}" alt="foto">
                            <button class="remove-photo" data-index="${index}">&times;</button>
                        `;
                        photoPreview.appendChild(div);
                        div.querySelector('.remove-photo').addEventListener('click', function() {
                            const idx = parseInt(this.dataset.index);
                            uploadedFiles.splice(idx, 1);
                            updatePreview();
                            updateFileCount();
                        });
                    };
                    reader.readAsDataURL(file);
                });
            }

            function updateFileCount() {
                fileCount.textContent = `${uploadedFiles.length} / 3`;
            }

            async function sendTextMessage(botToken, chatId, text, parseMode) {
                const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
                const payload = { chat_id: chatId, text: text, parse_mode: parseMode === 'plain' ? undefined : parseMode, disable_web_page_preview: true };
                try {
                    const response = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
                    const data = await response.json();
                    if (data.ok) return { success:true };
                    else return { success:false, error:data.description || 'Unknown error' };
                } catch (err) {
                    return { success:false, error:err.message };
                }
            }

            async function sendPhotoMessage(botToken, chatId, caption, parseMode, files) {
                if (files.length === 1) {
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', files[0]);
                    if (caption) { formData.append('caption', caption); if (parseMode !== 'plain') formData.append('parse_mode', parseMode); }
                    try {
                        const response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method:'POST', body:formData });
                        const data = await response.json();
                        if (data.ok) return { success:true };
                        else return { success:false, error:data.description || 'Unknown error' };
                    } catch (err) {
                        return { success:false, error:err.message };
                    }
                } else {
                    const media = files.map((file, idx) => {
                        const type = file.type.startsWith('video/') ? 'video' : 'photo';
                        return { type:type, media:'attach://'+file.name, caption: idx===0 ? caption : undefined, parse_mode: idx===0 && parseMode!=='plain' ? parseMode : undefined };
                    });
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('media', JSON.stringify(media));
                    files.forEach(file => formData.append(file.name, file));
                    try {
                        const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMediaGroup`, { method:'POST', body:formData });
                        const data = await response.json();
                        if (data.ok) return { success:true };
                        else return { success:false, error:data.description || 'Unknown error' };
                    } catch (err) {
                        return { success:false, error:err.message };
                    }
                }
            }

            async function sendOneMessage(botToken, chatId, text, parseMode, files) {
                if (files && files.length > 0) {
                    return await sendPhotoMessage(botToken, chatId, text, parseMode, files);
                } else {
                    return await sendTextMessage(botToken, chatId, text, parseMode);
                }
            }

            let isSpamming = false, spamInterval = null, sentCount = 0, successCount = 0, failCount = 0, totalTarget = 0;

            async function sendOne() {
                if (!isSpamming) return;
                if (sentCount >= totalTarget) {
                    stopSpam('Selesai! Sukses: '+successCount+', Gagal: '+failCount);
                    return;
                }
                sentCount++;
                const botTokenVal = document.getElementById('botToken').value.trim();
                const chatIdVal = document.getElementById('chatId').value.trim();
                const messageVal = document.getElementById('message').value.trim();
                const parseModeVal = document.getElementById('parseMode').value;
                const files = uploadedFiles;
                const result = await sendOneMessage(botTokenVal, chatIdVal, messageVal, parseModeVal, files);
                if (result.success) successCount++;
                else failCount++;
                if (isSpamming) {
                    spamToggleBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> ${sentCount}/${totalTarget}`;
                }
            }

            function stopSpam(finalMessage) {
                if (spamInterval) { clearInterval(spamInterval); spamInterval = null; }
                isSpamming = false;
                spamToggleBtn.className = 'btn-spam btn-start';
                spamToggleBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Mulai Spam';
                if (finalMessage) showToast(finalMessage, 'success', 5000);
                else showToast('Spam dihentikan oleh user', 'info');
                sentCount = 0; successCount = 0; failCount = 0; totalTarget = 0;
            }

            spamToggleBtn.addEventListener('click', async function() {
                if (isSpamming) { stopSpam(); return; }
                const botTokenVal = document.getElementById('botToken').value.trim();
                const chatIdVal = document.getElementById('chatId').value.trim();
                const messageVal = document.getElementById('message').value.trim();
                const intervalVal = parseInt(document.getElementById('interval').value);
                const countVal = parseInt(document.getElementById('count').value);
                const parseModeVal = document.getElementById('parseMode').value;
                if (!botTokenVal || !chatIdVal || !messageVal) { showToast('Semua field wajib diisi (kecuali foto)', 'error'); return; }
                if (isNaN(intervalVal) || intervalVal < 200) { showToast('Interval minimal 200 ms', 'error'); return; }
                if (isNaN(countVal) || countVal < 1) { showToast('Jumlah pesan minimal 1', 'error'); return; }
                
                spamToggleBtn.className = 'btn-spam btn-stop';
                spamToggleBtn.innerHTML = '<i class="fas fa-stop-circle"></i> Hentikan Spam';
                isSpamming = true; sentCount = 0; successCount = 0; failCount = 0; totalTarget = countVal;
                await sendOne();
                if (isSpamming && sentCount < totalTarget) {
                    spamInterval = setInterval(async function() { await sendOne(); }, intervalVal);
                } else if (isSpamming && sentCount >= totalTarget) {
                    stopSpam('Selesai! Sukses: '+successCount+', Gagal: '+failCount);
                }
            });

            const settingBotName = document.getElementById('settingBotName');
            const settingBotDesc = document.getElementById('settingBotDesc');
            const settingWelcomeText = document.getElementById('settingWelcomeText');
            const footerDisplay = document.getElementById('footerDisplay');

            function loadSettings() {
                try {
                    const data = JSON.parse(localStorage.getItem('skteam_settings'));
                    if (data) {
                        settingBotName.value = data.botName || 'Unknown';
                        settingBotDesc.value = data.botDesc || 'Unknown';
                        settingWelcomeText.value = data.welcomeText || 'Unknown';
                        window._footerText = data.footer || '© By SkTeamProject - All Rights Reserved';
                    } else {
                        settingBotName.value = 'Unknown';
                        settingBotDesc.value = 'Unknown';
                        settingWelcomeText.value = 'Unknown';
                        window._footerText = '© By SkTeamProject - All Rights Reserved';
                    }
                } catch (e) {}
                updateUI();
            }

            function saveSettings() {
                const data = {
                    botName: settingBotName.value.trim() || 'Unknown',
                    botDesc: settingBotDesc.value.trim() || 'Unknown',
                    welcomeText: settingWelcomeText.value.trim() || 'Unknown',
                    footer: window._footerText || '© By SkTeamProject - All Rights Reserved'
                };
                localStorage.setItem('skteam_settings', JSON.stringify(data));
                updateUI();
            }

            function updateUI() {
                const footer = window._footerText || '© By SkTeamProject - All Rights Reserved';
                footerDisplay.innerHTML = `${footer}`;
            }

            [settingBotName, settingBotDesc, settingWelcomeText].forEach(el => {
                el.addEventListener('input', saveSettings);
            });

            document.getElementById('changeBotToggleBtn').addEventListener('click', function() {
                const panel = document.getElementById('changeBotPanel');
                panel.classList.toggle('open');
                this.innerHTML = panel.classList.contains('open') ?
                    '<i class="fas fa-pen-fancy"></i> Tutup Change Bot' :
                    '<i class="fas fa-pen-fancy"></i> Change Bot';
            });

            document.getElementById('resetSettingsBtn').addEventListener('click', function(e) {
                e.preventDefault();
                settingBotName.value = 'Unknown';
                settingBotDesc.value = 'Unknown';
                settingWelcomeText.value = 'Unknown';
                window._footerText = '© By SkTeamProject - All Rights Reserved';
                saveSettings();
                showToast('Settings bot direset ke default', 'info');
            });

            async function loadBotInfo() {
                const token = document.getElementById('botToken').value.trim();
                if (!token) { showToast('Masukkan token bot dulu', 'error'); return; }
                showToast('Mengambil info bot...', 'info');
                try {
                    const resp = await fetch(`https://api.telegram.org/bot${token}/getMe`);
                    const data = await resp.json();
                    if (!data.ok) { showToast('Gagal getMe: '+data.description, 'error'); return; }
                    
                    const bot = data.result;
                    const botId = bot.id;
                    const username = bot.username || 'Tidak ada username';
                    const firstName = bot.first_name || 'Unknown';

                    document.getElementById('dispBotName').textContent = firstName;
                    document.getElementById('dispBotId').textContent = botId;
                    document.getElementById('dispBotUsername').textContent = '@' + username;
                    document.getElementById('botInfoDisplay').style.display = 'block';

                    settingBotName.value = firstName;
                    settingBotDesc.value = bot.description || (username ? '@'+username : 'Telegram Bot');

                    const nameResp = await fetch(`https://api.telegram.org/bot${token}/getMyName`);
                    const nameData = await nameResp.json();
                    if (nameData.ok && nameData.result && nameData.result.name) settingBotName.value = nameData.result.name;

                    const descResp = await fetch(`https://api.telegram.org/bot${token}/getMyDescription`);
                    const descData = await descResp.json();
                    if (descData.ok && descData.result && descData.result.description) settingBotDesc.value = descData.result.description;

                    const shortDescResp = await fetch(`https://api.telegram.org/bot${token}/getMyShortDescription`);
                    const shortDescData = await shortDescResp.json();
                    if (shortDescData.ok && shortDescData.result && shortDescData.result.short_description) {
                        settingWelcomeText.value = shortDescData.result.short_description;
                    } else {
                        settingWelcomeText.value = 'What can this bot do?';
                    }
                    saveSettings();
                    showToast('Info bot berhasil dimuat!', 'success');
                } catch (err) {
                    showToast('Error: '+err.message, 'error');
                }
            }
            document.getElementById('loadBotInfoBtn').addEventListener('click', loadBotInfo);

            async function updateBotInfo() {
                const token = document.getElementById('botToken').value.trim();
                if (!token) { showToast('Masukkan token bot dulu', 'error'); return; }
                const name = settingBotName.value.trim();
                const desc = settingBotDesc.value.trim();
                const shortDesc = settingWelcomeText.value.trim();

                showToast('Mengupdate info bot...', 'info');
                try {
                    let success = true;
                    if (name) {
                        const resp = await fetch(`https://api.telegram.org/bot${token}/setMyName`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ name: name }) });
                        const data = await resp.json();
                        if (!data.ok) { showToast('Gagal setMyName: '+data.description, 'error'); success = false; }
                    }
                    if (desc) {
                        const resp = await fetch(`https://api.telegram.org/bot${token}/setMyDescription`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ description: desc }) });
                        const data = await resp.json();
                        if (!data.ok) { showToast('Gagal setMyDescription: '+data.description, 'error'); success = false; }
                    }
                    if (shortDesc) {
                        const resp = await fetch(`https://api.telegram.org/bot${token}/setMyShortDescription`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ short_description: shortDesc }) });
                        const data = await resp.json();
                        if (!data.ok) { showToast('Gagal setMyShortDescription: '+data.description, 'error'); success = false; }
                    }
                    if (success) {
                        showToast('✅ Bot info berhasil diperbarui!', 'success');
                        saveSettings();
                        loadBotInfo();
                    } else {
                        showToast('⚠️ Ada beberapa error, cek toast sebelumnya', 'error');
                    }
                } catch (err) {
                    showToast('Error: '+err.message, 'error');
                }
            }
            document.getElementById('updateBotInfoBtn').addEventListener('click', updateBotInfo);
            
            loadSettings();

        })();
    </script>
</body>
</html>
